
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kashim</title>
    <meta name="application-name" content="Kashim">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kashim">
    <meta name="theme-color" content="#f5f5f7">
    <link rel="apple-touch-icon" href="/kashim-icon.png">
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons thin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css"/>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        /* Premium design tokens */
        --k-bg: #f5f5f7;
        --k-card: #ffffff;
        --k-text: #1d1d1f;
        --k-text2: #6e6e73;
        --k-text3: #aeaeb2;
        --k-border: #e8e8ed;
        --k-border2: #d2d2d7;
        --k-lime: #a8e716;
        --k-lime-dark: #7ab800;
        --k-lime-bg: #f0fad0;
        --k-red: #ff3b30;
        --k-blue: #007aff;
      }
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: var(--k-bg);
        color: var(--k-text);
      }
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      /* iPhone no app nativo: o WKWebView roda com contentInset 'automatic' e ja
         reserva o espaco do notch para tudo que esta no fluxo do scroll. Somar o
         inset do CSS aqui dava um vao de ~94px no topo (o dobro do necessario) a
         partir da segunda abertura do app.
         ATENCAO: esta regra depende de contentInset continuar 'automatic' no
         capacitor.config.ts. Se um dia virar 'never', o WebView para de reservar
         o espaco e esta regra tem de sair, senao o header sobe para debaixo do
         relogio. Elemento `fixed` (o menu de baixo) nao sofre contentInset e
         continua precisando do safe-bottom. */
      /* A regra que zerava o respiro do topo FOI REMOVIDA em 2026-09-09.
         Ela existia porque o WKWebView, com contentInset 'automatic', empurraria
         o conteudo sozinho — somar os dois daria ~94px de vao. Só que o print do
         Eduardo mostra o cabecalho ENCOSTADO na borda de cima: o empurrao do
         WebView nao esta acontecendo nesta configuracao (o app carrega uma URL
         remota via server.url). Zerando o nosso, ficava sem nenhum dos dois.
         Duas tentativas de acertar o TEMPO da coisa falharam. Agora a folga e
         nossa e ponto: sem depender de quando o WebView decide agir.
         Se um dia o vao dobrar, a correcao e `contentInset: 'never'` no
         capacitor.config.ts — que exige build nova — e NAO voltar a zerar aqui. */
      /* Piso para o rodapé no app nativo.
         Sintoma (iPhone 16 Pro Max, Eduardo, 2026-09-08): na PRIMEIRA abertura
         o menu de baixo aparece cortado pela metade; fechando e abrindo de novo
         fica certo. A hipótese é que `env(safe-area-inset-bottom)` ainda resolve
         0 na primeira pintura — o WKWebView não terminou de calcular as áreas
         seguras —, então o menu fica sem a folga do indicador de home. Da
         segunda vez o valor já existe e tudo se ajeita.
         `max()` não muda nada quando o inset chega certo (34px no 16 Pro Max):
         só garante um mínimo quando ele vem zerado. Restrito ao app nativo para
         não engordar a barra na web, onde o bug não existe.
         NÃO confundir com o menu cortado no TOPO, que é outro mecanismo
         (contentInset) e esse sim exige build nova. */
      /* Piso removido junto: com a folga do topo garantida, o rodape volta a
         usar o inset real. O Eduardo relatou sobra embaixo, e 16px forcados
         eram parte dela. */
      /* `100%` herda a altura que o WKWebView calculou na PRIMEIRA pintura —
         e nela as áreas seguras ainda não existem, então a tela nasce com a
         altura errada e o conteúdo aparece cortado. Abrir de novo dá certo
         porque aí o valor já está calculado.
         `dvh` acompanha a janela de verdade e se corrige sozinho quando ela
         muda. O `100%` fica como reserva para navegador antigo — a ordem
         importa: a última regra que o navegador entende é a que vale. */
      html, body { height: 100%; overflow-x: hidden; }
      html, body { height: 100dvh; }
      /* Tabular numbers for all monetary values */
      .k-num {
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        letter-spacing: -0.02em;
      }
      /* 3D lime pill button */
      .k-btn-lime {
        background: linear-gradient(180deg, #c5f23a 0%, #a2d800 50%, #8cc400 100%);
        box-shadow: 0 4px 14px rgba(130,192,0,0.4), 0 1px 3px rgba(0,0,0,0.12),
          inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -2px 0 rgba(0,0,0,0.08);
        border-radius: 999px;
        color: #182200;
        border: none;
        font-weight: 800;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        font-size: 11px;
        transition: transform 0.12s, box-shadow 0.12s;
      }
      .k-btn-lime:active {
        transform: scale(0.97);
        box-shadow: 0 2px 6px rgba(130,192,0,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
      }
      /* Card base */
      .k-card {
        background: var(--k-card);
        border: 1px solid var(--k-border);
        border-radius: 22px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      }
      /* Icon wrapper — thin line only */
      .k-icon-wrap {
        width: 34px; height: 34px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        background: var(--k-bg);
        border: 1px solid var(--k-border);
      }
      .k-icon-wrap i { font-size: 16px; color: var(--k-text2); }
      .k-icon-wrap.lime { background: var(--k-lime-bg); border-color: rgba(122,184,0,0.25); }
      .k-icon-wrap.lime i { color: var(--k-lime-dark); }
      .k-icon-wrap.red { background: #fff0f0; border-color: rgba(255,59,48,0.15); }
      .k-icon-wrap.red i { color: var(--k-red); }
      .k-icon-wrap.blue { background: #f0f4ff; border-color: rgba(0,122,255,0.15); }
      .k-icon-wrap.blue i { color: var(--k-blue); }
      .k-icon-wrap.purple { background: #f4f0ff; border-color: rgba(139,92,246,0.15); }
      .k-icon-wrap.purple i { color: #7c3aed; }

      /* ============================================================
         KASHIM — Cinematic visual layer (additive, purely decorative)
         All motion is opt-out via prefers-reduced-motion.
         ============================================================ */
      :root {
        --lime:  #a8e716;
        --lime2: #c5f23a;
        --ease-spring: cubic-bezier(.22, 1.4, .36, 1);
        --ease-out:    cubic-bezier(.16, 1, .3, 1);
        --glow: .55; /* global glow intensity — keeps things sophisticated */
      }

      /* ---- Ambient background layer (aurora + particles) ---- */
      .k-ambient {
        position: fixed; inset: 0;
        z-index: -10;
        pointer-events: none;
        overflow: hidden;
      }
      .k-aurora {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        will-change: transform;
        opacity: calc(var(--glow) * 0.5);
      }
      .k-aurora--1 {
        width: 46vw; height: 46vw; top: -10vh; left: -8vw;
        background: radial-gradient(circle, rgba(168,231,22,0.55) 0%, transparent 70%);
        animation: k-drift-a 34s var(--ease-out) infinite alternate;
      }
      .k-aurora--2 {
        width: 40vw; height: 40vw; bottom: -12vh; right: -6vw;
        background: radial-gradient(circle, rgba(0,122,255,0.35) 0%, transparent 70%);
        animation: k-drift-b 42s var(--ease-out) infinite alternate;
      }
      .k-aurora--3 {
        width: 34vw; height: 34vw; top: 34vh; left: 40vw;
        background: radial-gradient(circle, rgba(122,184,0,0.30) 0%, transparent 70%);
        animation: k-drift-c 38s var(--ease-out) infinite alternate;
      }
      @keyframes k-drift-a { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vw,5vh,0) scale(1.12); } }
      @keyframes k-drift-b { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(-7vw,-4vh,0) scale(1.08); } }
      @keyframes k-drift-c { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(-4vw,6vh,0) scale(1.15); } }

      /* ---- Entry reveal (cards / sections rise + fade) ----
         Uses `backwards` fill so NO transform lingers after the animation
         (a persisted transform would become the containing block for any
         position:fixed modal nested inside, mispositioning it). ---- */
      .k-reveal { animation: k-reveal .7s var(--ease-out) backwards; }
      @keyframes k-reveal {
        from { opacity: 0; transform: translateY(26px) scale(.98); }
        to   { opacity: 1; transform: translateY(0)    scale(1); }
      }
      /* stagger helpers */
      .k-stagger > * { animation: k-reveal .7s var(--ease-out) backwards; }
      .k-stagger > *:nth-child(1) { animation-delay: 0ms; }
      .k-stagger > *:nth-child(2) { animation-delay: 90ms; }
      .k-stagger > *:nth-child(3) { animation-delay: 180ms; }
      .k-stagger > *:nth-child(4) { animation-delay: 270ms; }
      .k-stagger > *:nth-child(5) { animation-delay: 360ms; }
      .k-stagger > *:nth-child(6) { animation-delay: 450ms; }
      .k-stagger > *:nth-child(7) { animation-delay: 540ms; }
      .k-stagger > *:nth-child(8) { animation-delay: 630ms; }

      /* ---- Light sweep across progress bars / surfaces ---- */
      .k-sweep { position: relative; overflow: hidden; }
      .k-sweep::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.55) 50%, transparent 80%);
        transform: translateX(-120%);
        animation: k-sweep 2.6s var(--ease-out) 0.4s;
        pointer-events: none;
      }
      @keyframes k-sweep { to { transform: translateX(120%); } }

      /* Badge do sino de chamados (admin). Pulsa por box-shadow, sem escalar
         o elemento — o mesmo cuidado do k-halo, para não criar overflow. */
      @keyframes kashimPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
        50%      { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        [style*="kashimPulse"] { animation: none !important; }
      }

      /* ---- Glowing halo (LANÇAR button) ----
         Pulses via box-shadow only — no scaled pseudo-elements, so it never
         adds layout/scroll overflow to the horizontally-scrolling tab bar. ---- */
      .k-halo { animation: k-halo 2.6s ease-in-out infinite; }
      @keyframes k-halo {
        0%, 100% {
          box-shadow: 0 4px 14px rgba(130,192,0,0.40),
            inset 0 1px 0 rgba(255,255,255,0.45),
            0 0 0 0 rgba(168,231,22,0.0);
        }
        50% {
          box-shadow: 0 4px 20px rgba(130,192,0,0.55),
            inset 0 1px 0 rgba(255,255,255,0.45),
            0 0 16px 3px rgba(168,231,22, calc(var(--glow) * 0.7));
        }
      }

      /* ---- Fire / streak pulse ---- */
      .k-pulse { animation: k-pulse 1.8s ease-in-out infinite; transform-origin: center; }
      @keyframes k-pulse {
        0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255,140,0,0)); }
        50%      { transform: scale(1.14); filter: drop-shadow(0 0 6px rgba(255,140,0,0.6)); }
      }

      /* ---- Neon glow for dark cards ---- */
      .k-glow-lime { filter: drop-shadow(0 0 6px rgba(168,231,22,calc(var(--glow) * 0.9))); }

      /* ---- Confetti burst (decorative, JS spawns) ---- */
      .k-confetti-piece {
        position: fixed; top: 50%; left: 50%;
        width: 8px; height: 8px; border-radius: 2px;
        pointer-events: none; z-index: 300;
        will-change: transform, opacity;
        animation: k-confetti var(--k-dur, 1100ms) var(--ease-out) forwards;
      }
      @keyframes k-confetti {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
        100% { transform: translate(var(--k-x), var(--k-y)) rotate(var(--k-r)); opacity: 0; }
      }

      /* ---- Print / PDF da consultoria (visível só para o coach) ---- */
      @media print {
        @page { size: A4 landscape; margin: 0.7cm; }
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        /* Esconde todo o chrome da app */
        #header,
        nav,
        #stets,
        #diagnosis,
        #summary-mobile,
        #month-navigator,
        .k-ambient,
        #coach-pdf-btn,
        #cycle-management { display: none !important; }
        /* Força a Compilação Financeira a aparecer */
        #summary-section { display: block !important; }
        /* Esconde botões interativos dentro dos blocos */
        #blocks button { display: none !important; }
        /* Remove min-widths para caber 12 meses na folha */
        #blocks th, #blocks td,
        #summary-section th, #summary-section td { min-width: 0 !important; }
        /* Reduz fonte e padding para os valores caberem na folha A4 paisagem */
        #blocks table, #summary-section table { font-size: 8.5px !important; width: 100% !important; }
        #blocks table th, #blocks table td,
        #summary-section table th, #summary-section table td { padding: 3px 5px !important; }
        body { background: white !important; }
        /* Garante que inputs/selects de dia não apareçam no PDF */
        #blocks input, #blocks select { display: none !important; }
      }

      /* ---- App nativo (Capacitor): esconde login social ----
         Google bloqueia OAuth em WebView (403 disallowed_useragent).
         A classe .native-app é adicionada ao <html> no App.tsx. ---- */
      .native-app .cl-socialButtons,
      .native-app .cl-socialButtonsBlockButton,
      .native-app .cl-socialButtonsIconButton,
      .native-app .cl-dividerRow { display: none !important; }

      /* ---- Respect reduced motion: kill all decorative motion ---- */
      @media (prefers-reduced-motion: reduce) {
        .k-aurora, .k-reveal, .k-stagger > *, .k-sweep::after,
        .k-halo, .k-pulse, .k-confetti-piece {
          animation: none !important;
        }
        .k-reveal, .k-stagger > * { opacity: 1 !important; transform: none !important; }
        .k-ambient { display: none; }
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/index.css">
</head>
<body class="font-sans">
    <div id="root"></div>
<script>
      /* Empurrao de layout na PRIMEIRA abertura do app nativo.
         O WKWebView pinta antes de terminar de calcular as areas seguras: a
         tela nasce com a altura errada e o conteudo aparece cortado. Reabrir
         resolve porque na segunda vez o valor ja existe.
         Mexer na altura da raiz e desfazer no quadro seguinte obriga o
         navegador a refazer a conta com os valores certos. Invisivel (o
         usuario nao ve piscar) e sem efeito nenhum na web, onde o bug nao
         existe. Roda uma vez, e de novo apos 300ms para o caso de o inset
         chegar depois. */
      (function () {
        if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
        function recalcular() {
          var raiz = document.documentElement;
          raiz.style.height = '100.1%';
          requestAnimationFrame(function () {
            raiz.style.height = '';
            window.dispatchEvent(new Event('resize'));
          });
        }
        window.addEventListener('load', function () {
          recalcular();
          setTimeout(recalcular, 300);
        });
      })();
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
