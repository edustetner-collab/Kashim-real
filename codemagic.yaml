workflows:
  ios-release:
    name: Kashim iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - kashim
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kashim.app"
      node: 22

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app (Vite)
        script: |
          npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS
        script: |
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          if [ -n "$PROFILE" ]; then
            TEMP=$(mktemp /tmp/profile.XXXXXX.plist)
            security cms -D -i "$PROFILE" > "$TEMP" 2>/dev/null
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TEMP" 2>/dev/null)
            rm -f "$TEMP"
            echo "Using provisioning profile UUID: $UUID"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "$XCODE_SCHEME" \
              --archive-xcargs "DEVELOPMENT_TEAM=4HT3W2MZV6 PROVISIONING_PROFILE=$UUID CODE_SIGN_STYLE=Manual"
          else
            echo "No provisioning profile found, using xcode-project defaults"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "$XCODE_SCHEME" \
              --archive-xcargs "DEVELOPMENT_TEAM=4HT3W2MZV6"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
        expire_build_submitted_for_review: true
