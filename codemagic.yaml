workflows:
  ios-release:
    name: Kashim iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - kashim
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kashim.app"
      xcode: latest
      node: 22

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app (Vite)
        script: |
          npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --save || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Build iOS
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild \
            -project "ios/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "/Users/builder/clone/build/ios/xcarchive/App.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=iPhone Distribution" \
            DEVELOPMENT_TEAM=4HT3W2MZV6 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > /tmp/xcodebuild_logs/build.log 2>&1 || true
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 /tmp/xcodebuild_logs/build.log
          echo "=== LINES CONTAINING error/Error/ERROR ==="
          grep -i "error" /tmp/xcodebuild_logs/build.log | grep -v "ErrorHandl\|noError\|errorCode\|0 error" | head -50
          # Fail if archive didn't produce output
          test -d "/Users/builder/clone/build/ios/xcarchive/App.xcarchive" || exit 65

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
